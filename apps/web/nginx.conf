server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # X-Forwarded-For sobrescrito (não acrescentado) com o IP da conexão: a API confia em um salto,
  # então o cliente não consegue escolher o próprio IP para escapar do limite de login.

  # Server-Sent Events: sem buffer e com conexão longa
  location = /api/v1/events {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Saúde e métricas ficam só na porta da API (3000). Sem isto, a SPA responderia 200 com o
  # index.html e a readiness pareceria boa pelo endereço da aplicação.
  location ~ ^/(health|metrics) {
    return 404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
