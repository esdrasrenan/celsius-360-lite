name: celsius-360-lite

# Imagem única (Bun) para a ingestão e a API; o web é um nginx com o build estático.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  # Tag por projeto: a stack de E2E (celsius-e2e) não reetiqueta a imagem da demonstração
  image: ${COMPOSE_PROJECT_NAME:-celsius-360-lite}/app:local
  restart: "no"

x-app-env: &app-env
  DATABASE_URL: postgres://celsius@timescaledb:5432/celsius
  CLICKHOUSE_URL: http://clickhouse:8123
  DATA_DIR: /dados
  TELEMETRY_FILE: ${TELEMETRY_FILE:-telemetrias.jsonl}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  timescaledb:
    image: timescale/timescaledb:2.31.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: celsius
      POSTGRES_DB: celsius
      # Ambiente local: sem senha, acessível só pela rede do Compose e por 127.0.0.1
      POSTGRES_HOST_AUTH_METHOD: trust
      TS_TUNE_MEMORY: 2GB
    command:
      ["postgres", "-c", "shared_preload_libraries=timescaledb", "-c", "timescaledb.telemetry_level=off"]
    # Porta alta no host para não colidir com um Postgres local
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    volumes: [timescale-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celsius -d celsius"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    restart: unless-stopped
    environment:
      # Usuário default sem senha, exposto só na rede do Compose e em 127.0.0.1
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ports: ["127.0.0.1:${CLICKHOUSE_PORT:-58123}:8123"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes: [clickhouse-data:/var/lib/clickhouse]
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Migrações, cadastro, temperatura externa e segredo da sessão. Roda uma vez, termina e mostra o
  # quadro de acesso (docker compose logs setup).
  setup:
    <<: *app
    command: ["bun", "run", "apps/ingest/src/main.ts", "setup"]
    environment:
      <<: *app-env
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      # Sem JWT_SECRET no .env, o setup gera o segredo uma vez no volume celsius-secrets
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_SECRET_FILE: /run/celsius-secrets/jwt-secret
      APP_URL: http://127.0.0.1:${WEB_PORT:-8080}
    volumes: ["${DATA_PATH:-./dados}:/dados:ro", "celsius-secrets:/run/celsius-secrets"]
    depends_on:
      timescaledb: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  # Reproduz dados/telemetrias.jsonl como se chegasse do broker, na ordem do arquivo. Se cair (banco
  # reiniciando), volta e retoma do checkpoint; no fim do arquivo termina com código 0.
  ingest:
    <<: *app
    command: ["bun", "run", "apps/ingest/src/main.ts", "replay"]
    restart: on-failure
    environment:
      <<: *app-env
      INGEST_RATE: ${INGEST_RATE:-1000}
      # Para rede-sintetica --medir (docker compose run --rm ingest ...)
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      API_URL: http://api:3000
    volumes: ["${DATA_PATH:-./dados}:/dados:ro"]
    ports: ["127.0.0.1:${INGEST_METRICS_PORT:-9464}:9464"]
    depends_on:
      setup: { condition: service_completed_successfully }

  api:
    <<: *app
    command: ["bun", "run", "apps/api/src/main.ts"]
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: 3000
      # JWT_SECRET do .env tem precedência; sem ele, vale o segredo gerado pelo setup
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_SECRET_FILE: /run/celsius-secrets/jwt-secret
      DEMO_MODE: ${DEMO_MODE:-true}
    ports: ["127.0.0.1:${API_PORT:-3000}:3000"]
    volumes: ["celsius-secrets:/run/celsius-secrets:ro"]
    depends_on:
      setup: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-celsius-360-lite}/web:local
    restart: unless-stopped
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  timescale-data:
  clickhouse-data:
  celsius-secrets:
